backend:
  name: github
  repo: jones0909/employer-pool-landing
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "landing"
    label: "Landing Page"
    files:
      - name: "content"
        label: "Page Content"
        file: "content/landing.json"
        format: "json"
        fields:
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Badge Text", name: "badge", widget: "string" }
              - { label: "Title (Bold)", name: "title_bold", widget: "string" }
              - { label: "Title (Faded)", name: "title_fade", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "text" }
              - { label: "Primary CTA", name: "cta_primary", widget: "string" }
              - { label: "Secondary CTA", name: "cta_secondary", widget: "string" }

          - label: "Stats"
            name: "stats"
            widget: "list"
            fields:
              - { label: "Number", name: "num", widget: "string" }
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Source", name: "source", widget: "string", required: false }

          - label: "Marquee Keywords"
            name: "marquee"
            widget: "list"
            field: { label: "Keyword", name: "keyword", widget: "string" }

          - label: "Pain Points"
            name: "pain_points"
            widget: "object"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Title Accent", name: "title_accent", widget: "string" }
              - label: "Items"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Icon (clock/filter/globe)", name: "icon", widget: "string" }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "desc", widget: "text" }

          - label: "How It Works"
            name: "how_it_works"
            widget: "object"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Title Accent", name: "title_accent", widget: "string" }
              - label: "Steps"
                name: "steps"
                widget: "list"
                fields:
                  - { label: "Number", name: "num", widget: "string" }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "desc", widget: "text" }

          - label: "Benefits"
            name: "benefits"
            widget: "object"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Title Accent", name: "title_accent", widget: "string" }
              - label: "Items"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "desc", widget: "text" }

          - label: "Roles"
            name: "roles"
            widget: "object"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Title Accent", name: "title_accent", widget: "string" }
              - label: "Categories"
                name: "categories"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Examples", name: "examples", widget: "string" }

          - label: "Trust / Screening"
            name: "trust"
            widget: "object"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Title Accent", name: "title_accent", widget: "string" }
              - label: "Items"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "desc", widget: "text" }

          - label: "CTA Section"
            name: "cta"
            widget: "object"
            fields:
              - { label: "Title Text", name: "title_text", widget: "string" }
              - { label: "Title Accent", name: "title_accent", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "text" }
              - { label: "Primary Button", name: "primary_btn", widget: "string" }
              - { label: "Contact Email", name: "contact_email", widget: "string" }
              - { label: "WeChat ID", name: "contact_wechat", widget: "string", required: false }

          - label: "Footer"
            name: "footer"
            widget: "object"
            fields:
              - { label: "Copyright", name: "copyright", widget: "string" }
