<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>海外实习雇主资源池 AI 智能体 | From Mars</title>
  <meta name="description" content="用 AI 主动发现、评估、联系海外雇主，建立自有、真实、可验证、可持续更新的海外实习岗位池，再匹配给中国学生。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--orange:#FF4D00;--orange-light:#FFF3ED;--orange-hover:#E64500;--black:#1A1A1A;--gray-dark:#4A4A4A;--gray-mid:#888;--gray-light:#F5F5F5;--yellow:#FFF200;--white:#FFF;--font:'Inter','Noto Sans SC',system-ui,sans-serif;--mono:'SF Mono','Fira Code',monospace;--max-w:1100px;--section-pad:100px}
    body,html{font-family:var(--font);color:var(--black);background:var(--white);scroll-behavior:smooth;overflow-x:hidden}
    .container{max-width:var(--max-w);margin:0 auto;padding:0 32px}

    /* NAV */
    .nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(255,255,255,0.95);backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,0,0,0.04)}
    .nav-inner{max-width:var(--max-w);margin:0 auto;padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:72px}
    .nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--black)}
    .nav-logo svg{width:32px;height:32px}
    .nav-logo span{font-weight:800;font-size:16px;letter-spacing:-0.02em}
    .nav-links{display:flex;align-items:center;gap:8px}
    .nav-links a{font-size:13px;font-weight:500;text-decoration:none;color:var(--black);padding:8px 16px;border-radius:100px;transition:all 0.2s;letter-spacing:0.02em}
    .nav-links a:hover{background:var(--gray-light)}
    .nav-links a.cta{background:var(--orange);color:white;font-weight:600}
    .nav-links a.cta:hover{background:var(--orange-hover)}

    /* HERO */
    .hero{padding:160px 0 var(--section-pad)}
    .hero-badge{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--gray-mid);margin-bottom:32px}
    .hero-badge::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--orange)}
    .hero h1{font-size:clamp(40px,5.5vw,64px);font-weight:900;line-height:1.08;letter-spacing:-0.03em;color:var(--black);max-width:900px}
    .hero h1 .fade{color:#C0C0C0}
    .hero-sub{font-size:18px;line-height:1.7;color:var(--gray-dark);max-width:640px;margin-top:32px}
    .hero-icons{display:flex;gap:16px;margin-top:40px}
    .hero-icons svg{width:36px;height:36px;fill:var(--orange)}

    /* STATS */
    .stats-bar{padding:60px 0;border-top:1px solid rgba(0,0,0,0.06);border-bottom:1px solid rgba(0,0,0,0.06)}
    .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:32px}
    .stat-item{text-align:center}
    .stat-num{font-size:42px;font-weight:900;color:var(--orange);letter-spacing:-0.03em}
    .stat-label{font-size:13px;color:var(--gray-mid);margin-top:6px;line-height:1.4}
    .stat-source{font-size:10px;color:#bbb;margin-top:2px;font-family:var(--mono)}

    /* MARQUEE */
    .marquee-wrap{padding:24px 0;background:var(--yellow);overflow:hidden}
    .marquee-track{display:flex;animation:marquee 25s linear infinite;white-space:nowrap}
    .marquee-track span{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;padding:0 24px;display:flex;align-items:center;gap:24px}
    .marquee-track span::after{content:'';display:block;width:14px;height:14px;background:var(--black);clip-path:polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%)}
    @keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

    /* SECTIONS */
    .section{padding:var(--section-pad) 0}
    .section-label{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--gray-mid);margin-bottom:20px}
    .section-label::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--orange)}
    .section-title{font-size:clamp(28px,3.5vw,42px);font-weight:800;line-height:1.15;letter-spacing:-0.02em;max-width:700px}
    .section-title .accent{color:var(--orange)}

    /* CAPABILITIES */
    .cap-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:40px;margin-top:56px}
    .cap-card{border:1px solid rgba(0,0,0,0.06);border-radius:16px;padding:40px;transition:all 0.3s}
    .cap-card:hover{box-shadow:0 8px 40px rgba(0,0,0,0.06);transform:translateY(-2px)}
    .cap-id{font-family:var(--mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--gray-mid);margin-bottom:16px;display:flex;align-items:center;gap:8px}
    .cap-id::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--orange)}
    .cap-card h3{font-size:22px;font-weight:800;letter-spacing:-0.01em;margin-bottom:12px}
    .cap-card p{font-size:14px;line-height:1.65;color:var(--gray-dark);margin-bottom:20px}
    .cap-line{width:36px;height:2px;background:var(--orange);margin-bottom:20px;border-radius:2px}
    .cap-features{list-style:none;display:flex;flex-direction:column;gap:12px}
    .cap-features li{font-size:14px;font-weight:500;display:flex;align-items:center;gap:12px}
    .cap-features li::before{content:'';width:16px;height:16px;flex-shrink:0;background:var(--orange);clip-path:polygon(50% 0%,65% 35%,100% 50%,65% 65%,50% 100%,35% 65%,0% 50%,35% 35%)}

    /* PIPELINE */
    .pipeline{padding:var(--section-pad) 0;background:var(--gray-light)}
    .flow-steps{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin-top:48px}
    .flow-step{text-align:center;padding:24px 12px;position:relative}
    .flow-step::after{content:'';position:absolute;top:36px;right:-8px;width:16px;height:2px;background:var(--orange)}
    .flow-step:last-child::after{display:none}
    .flow-num{width:48px;height:48px;border-radius:50%;background:var(--orange);color:white;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;margin:0 auto 14px}
    .flow-step h4{font-size:13px;font-weight:700;margin-bottom:6px}
    .flow-step p{font-size:11px;color:var(--gray-mid);line-height:1.45}

    /* FUNNEL */
    .funnel-bars{margin-top:48px;display:flex;flex-direction:column;gap:8px}
    .funnel-row{display:flex;align-items:center;gap:20px}
    .funnel-bar{height:44px;border-radius:8px;background:var(--orange);display:flex;align-items:center;padding:0 20px;color:white;font-weight:600;font-size:13px;white-space:nowrap;transition:all 0.3s}
    .funnel-bar:hover{filter:brightness(1.1)}
    .funnel-label{font-size:13px;color:var(--gray-dark);font-weight:500;white-space:nowrap;min-width:100px;text-align:right}

    /* COUNTRIES */
    .countries{padding:var(--section-pad) 0;background:var(--gray-light)}
    .country-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:48px}
    .country-card{background:white;border-radius:12px;padding:28px;border:1px solid rgba(0,0,0,0.04)}
    .country-card .priority{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:0.08em;margin-bottom:10px}
    .country-card .priority.p0{color:var(--orange)}
    .country-card .priority.p1{color:#E6A000}
    .country-card .priority.p2{color:var(--gray-mid)}
    .country-card h4{font-size:15px;font-weight:700;margin-bottom:8px}
    .country-card p{font-size:12px;line-height:1.55;color:var(--gray-dark)}

    /* ROADMAP */
    .roadmap-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:48px}
    .roadmap-card{border:1px solid rgba(0,0,0,0.06);border-radius:12px;padding:28px;transition:all 0.2s}
    .roadmap-card:hover{border-color:var(--orange)}
    .roadmap-week{font-family:var(--mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--orange);font-weight:700;margin-bottom:10px}
    .roadmap-card h4{font-size:15px;font-weight:700;margin-bottom:8px;line-height:1.35}
    .roadmap-card .win{font-size:12px;color:var(--gray-mid);line-height:1.5;margin-top:8px;padding-top:8px;border-top:1px solid rgba(0,0,0,0.04)}
    .roadmap-card .win strong{color:var(--orange)}

    /* RISK */
    .risk{padding:var(--section-pad) 0;background:var(--gray-light)}
    .risk-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:48px}
    .risk-card{background:white;border-radius:12px;padding:28px;border-left:3px solid var(--orange)}
    .risk-card h4{font-size:15px;font-weight:700;margin-bottom:8px}
    .risk-card p{font-size:13px;line-height:1.6;color:var(--gray-dark)}

    /* CTA */
    .cta-section{padding:var(--section-pad) 0;text-align:center}
    .cta-section h2{font-size:clamp(28px,3.5vw,42px);font-weight:900;letter-spacing:-0.02em}
    .cta-section h2 .accent{color:var(--orange)}
    .cta-section p{font-size:16px;color:var(--gray-dark);margin:20px auto 36px;max-width:500px;line-height:1.7}
    .btn-primary{display:inline-flex;align-items:center;gap:10px;background:var(--orange);color:white;font-size:15px;font-weight:600;padding:16px 36px;border-radius:100px;text-decoration:none;transition:all 0.2s;border:none;cursor:pointer;font-family:var(--font)}
    .btn-primary:hover{background:var(--orange-hover);transform:translateY(-1px)}
    .btn-primary svg{width:18px;height:18px}
    .btn-outline{display:inline-flex;align-items:center;gap:10px;background:transparent;color:var(--orange);font-size:14px;font-weight:600;padding:14px 28px;border-radius:100px;text-decoration:none;transition:all 0.2s;border:1.5px solid var(--orange);cursor:pointer;margin-left:12px;font-family:var(--font)}
    .btn-outline:hover{background:var(--orange-light)}

    /* FOOTER */
    .footer{padding:48px 0;border-top:1px solid rgba(0,0,0,0.06)}
    .footer-inner{display:flex;justify-content:space-between;align-items:center}
    .footer-left{font-size:12px;color:var(--gray-mid)}
    .footer-links{display:flex;gap:24px}
    .footer-links a{font-size:12px;color:var(--gray-mid);text-decoration:none;transition:color 0.2s}
    .footer-links a:hover{color:var(--orange)}

    /* RESPONSIVE */
    @media(max-width:768px){
      .stats-grid{grid-template-columns:repeat(2,1fr)}
      .cap-grid,.risk-grid{grid-template-columns:1fr}
      .flow-steps{grid-template-columns:1fr}
      .flow-step::after{display:none}
      .country-grid,.roadmap-grid{grid-template-columns:1fr}
      .nav-links a:not(.cta){display:none}
      .container{padding:0 20px}
      .footer-inner{flex-direction:column;gap:16px}
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <div class="nav-inner">
    <a href="#" class="nav-logo">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="8" cy="8" r="6" fill="#FF4D00"/>
        <circle cx="24" cy="8" r="6" fill="#FF4D00"/>
        <circle cx="8" cy="24" r="6" fill="#FF4D00"/>
        <circle cx="24" cy="24" r="6" fill="#FF4D00"/>
      </svg>
      <span>FROM MARS</span>
    </a>
    <div class="nav-links">
      <a href="#capabilities">能力</a>
      <a href="#pipeline">流程</a>
      <a href="#roadmap">路线</a>
      <a href="#contact" class="cta">预约咨询</a>
    </div>
  </div>
</nav>

<!-- Content rendered by JS from /content/landing.json -->
<div id="app"></div>

<script>
fetch('/content/landing.json')
  .then(r => r.json())
  .then(d => {
    const app = document.getElementById('app');

    const esc = s => s.replace(/</g,'&lt;').replace(/>/g,'&gt;');

    app.innerHTML = `
    <!-- HERO -->
    <section class="hero">
      <div class="container">
        <div class="hero-badge">${esc(d.hero.badge)}</div>
        <h1>${esc(d.hero.title_bold)}<span class="fade">${esc(d.hero.title_fade)}</span></h1>
        <p class="hero-sub">${esc(d.hero.subtitle)}</p>
        <div class="hero-icons">
          <svg viewBox="0 0 36 36"><path d="M18 0L23 13L36 18L23 23L18 36L13 23L0 18L13 13Z" fill="#FF4D00"/></svg>
          <svg viewBox="0 0 36 36"><path d="M18 4L22 14L32 18L22 22L18 32L14 22L4 18L14 14Z" fill="#FF4D00"/></svg>
          <svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="12" fill="none" stroke="#FF4D00" stroke-width="3"/><line x1="18" y1="6" x2="18" y2="30" stroke="#FF4D00" stroke-width="2"/><line x1="6" y1="18" x2="30" y2="18" stroke="#FF4D00" stroke-width="2"/></svg>
        </div>
      </div>
    </section>

    <!-- STATS -->
    <section class="stats-bar">
      <div class="container">
        <div class="stats-grid">
          ${d.stats.map(s => `
            <div class="stat-item">
              <div class="stat-num">${esc(s.num)}</div>
              <div class="stat-label">${esc(s.label)}</div>
              <div class="stat-source">${esc(s.source)}</div>
            </div>
          `).join('')}
        </div>
      </div>
    </section>

    <!-- MARQUEE -->
    <div class="marquee-wrap">
      <div class="marquee-track">
        ${d.marquee.concat(d.marquee).map(m => `<span>${esc(m)}</span>`).join('')}
      </div>
    </div>

    <!-- CAPABILITIES -->
    <section class="section" id="capabilities">
      <div class="container">
        <div class="section-label">核心能力 Capabilities</div>
        <h2 class="section-title">六大 AI 智能体能力<span class="accent">，覆盖雇主开发全链路</span></h2>
        <div class="cap-grid">
          ${d.capabilities.map(c => `
            <div class="cap-card">
              <div class="cap-id">${esc(c.id)} — ${esc(c.id_label)}</div>
              <h3>${esc(c.title)}</h3>
              <p>${esc(c.desc)}</p>
              <div class="cap-line"></div>
              <ul class="cap-features">
                ${c.features.map(f => `<li>${esc(f)}</li>`).join('')}
              </ul>
            </div>
          `).join('')}
        </div>
      </div>
    </section>

    <!-- PIPELINE -->
    <section class="pipeline" id="pipeline">
      <div class="container">
        <div class="section-label">核心闭环 Core Loop</div>
        <h2 class="section-title">从 AI 发现到录用<span class="accent">，全链路闭环</span></h2>
        <div class="flow-steps">
          ${d.pipeline.map((s, i) => `
            <div class="flow-step">
              <div class="flow-num">${i + 1}</div>
              <h4>${esc(s.title)}</h4>
              <p>${esc(s.desc)}</p>
            </div>
          `).join('')}
        </div>
      </div>
    </section>

    <!-- FUNNEL -->
    <section class="section">
      <div class="container">
        <div class="section-label">转化漏斗 Funnel</div>
        <h2 class="section-title">外联到录用<span class="accent">的真实转化路径</span></h2>
        <div class="funnel-bars">
          ${d.funnel.map(f => `
            <div class="funnel-row">
              <div class="funnel-label">${esc(f.label)}</div>
              <div class="funnel-bar" style="width:${f.width}%">${esc(f.value)}</div>
            </div>
          `).join('')}
        </div>
      </div>
    </section>

    <!-- COUNTRIES -->
    <section class="countries" id="countries">
      <div class="container">
        <div class="section-label">国家策略 Country Strategy</div>
        <h2 class="section-title">按优先级分层<span class="accent">的全球布局</span></h2>
        <div class="country-grid">
          ${d.countries.map(c => `
            <div class="country-card">
              <div class="priority ${c.priority.toLowerCase()}">${esc(c.priority)} — ${c.priority === 'P0' ? '最高优先' : c.priority === 'P1' ? '次优先' : '长期'}</div>
              <h4>${esc(c.title)}</h4>
              <p>${esc(c.desc)}</p>
            </div>
          `).join('')}
          <div class="country-card" style="display:flex;align-items:center;justify-content:center;background:var(--orange-light);border:1px dashed var(--orange);">
            <div style="text-align:center;">
              <div style="font-size:28px;margin-bottom:8px;">&#127759;</div>
              <h4 style="font-size:14px;color:var(--orange);">持续扩展中…</h4>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ROADMAP -->
    <section class="section" id="roadmap">
      <div class="container">
        <div class="section-label">12 周路线 MVP Roadmap</div>
        <h2 class="section-title">从零到可演示<span class="accent">的最小可行产品</span></h2>
        <div class="roadmap-grid">
          ${d.roadmap.map(r => `
            <div class="roadmap-card">
              <div class="roadmap-week">${esc(r.week)}</div>
              <h4>${esc(r.title)}</h4>
              <div class="win"><strong>小赢：</strong>${esc(r.win)}</div>
            </div>
          `).join('')}
        </div>
      </div>
    </section>

    <!-- RISK -->
    <section class="risk">
      <div class="container">
        <div class="section-label">风险控制 Risk Control</div>
        <h2 class="section-title">宁可岗位少<span class="accent">，也不要假</span></h2>
        <div class="risk-grid">
          ${d.risks.map(r => `
            <div class="risk-card">
              <h4>${esc(r.title)}</h4>
              <p>${esc(r.desc)}</p>
            </div>
          `).join('')}
        </div>
      </div>
    </section>

    <!-- CTA -->
    <section class="cta-section section" id="contact">
      <div class="container">
        <div class="section-label" style="justify-content:center;">开始合作 Get Started</div>
        <h2>${esc(d.cta.title_text)}<span class="accent">${esc(d.cta.title_accent)}</span></h2>
        <p>${esc(d.cta.subtitle)}</p>
        <div>
          <a href="mailto:team@frommars.studio" class="btn-primary">
            ${esc(d.cta.primary_btn)}
            <svg viewBox="0 0 18 18" fill="none"><path d="M4 9h10M10 5l4 4-4 4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>
        </div>
      </div>
    </section>

    <!-- FOOTER -->
    <footer class="footer">
      <div class="container">
        <div class="footer-inner">
          <div class="footer-left">${esc(d.footer.copyright)}</div>
          <div class="footer-links">
            <a href="#capabilities">能力</a>
            <a href="#pipeline">流程</a>
            <a href="#roadmap">路线</a>
            <a href="#contact">联系</a>
          </div>
        </div>
      </div>
    </footer>
    `;
  });
</script>

</body>
</html>
