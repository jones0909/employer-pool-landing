<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>International Intern Matching | Employer Pool AI Studio</title>
  <meta name="description" content="We match SMEs and corporates with pre-screened, trained international interns. Zero recruitment cost, fast matching, full support.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--orange:#FF4D00;--orange-light:#FFF3ED;--orange-hover:#E64500;--black:#1A1A1A;--gray-dark:#4A4A4A;--gray-mid:#888;--gray-light:#F5F5F5;--yellow:#FFF200;--white:#FFF;--font:'Inter','Noto Sans SC',system-ui,sans-serif;--mono:'SF Mono','Fira Code',monospace;--max-w:1100px;--section-pad:100px}
    body,html{font-family:var(--font);color:var(--black);background:var(--white);scroll-behavior:smooth;overflow-x:hidden}
    .container{max-width:var(--max-w);margin:0 auto;padding:0 32px}

    /* NAV */
    .nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(255,255,255,0.95);backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,0,0,0.04)}
    .nav-inner{max-width:var(--max-w);margin:0 auto;padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:72px}
    .nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--black)}
    .nav-logo svg{width:32px;height:32px}
    .nav-logo span{font-weight:800;font-size:16px;letter-spacing:-0.02em}
    .nav-links{display:flex;align-items:center;gap:8px}
    .nav-links a{font-size:13px;font-weight:500;text-decoration:none;color:var(--black);padding:8px 16px;border-radius:100px;transition:all 0.2s}
    .nav-links a:hover{background:var(--gray-light)}
    .nav-links a.cta{background:var(--orange);color:white;font-weight:600}
    .nav-links a.cta:hover{background:var(--orange-hover)}

    /* HERO */
    .hero{padding:140px 0 80px;position:relative;overflow:hidden;background:linear-gradient(160deg,#FFF 0%,#FFF8F5 40%,#FFF3ED 100%)}
    .hero-inner{display:grid;grid-template-columns:1.1fr 0.9fr;gap:48px;align-items:center}
    .hero-content{position:relative;z-index:2}
    .hero-badge{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--gray-mid);margin-bottom:32px}
    .hero-badge::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--orange)}
    .hero h1{font-size:clamp(36px,4.5vw,56px);font-weight:900;line-height:1.1;letter-spacing:-0.03em;color:var(--black);max-width:600px}
    .hero h1 .fade{color:#C0C0C0}
    .hero-sub{font-size:17px;line-height:1.7;color:var(--gray-dark);max-width:520px;margin-top:28px}
    .hero-cta{display:flex;gap:12px;margin-top:36px;flex-wrap:wrap}
    .hero-trust{display:flex;gap:24px;margin-top:36px;padding-top:28px;border-top:1px solid rgba(0,0,0,0.06)}
    .hero-trust-item{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--gray-dark);font-weight:500}
    .hero-trust-item svg{width:18px;height:18px;flex-shrink:0}
    .hero-visual{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;min-height:420px}
    .hero-card{background:white;border-radius:16px;padding:24px 28px;box-shadow:0 4px 32px rgba(0,0,0,0.06);position:absolute;backdrop-filter:blur(8px)}
    .hero-card-1{top:20px;right:20px;animation:float1 6s ease-in-out infinite}
    .hero-card-2{bottom:60px;left:0;animation:float2 7s ease-in-out infinite}
    .hero-card-3{top:50%;right:0;transform:translateY(-50%);animation:float3 5s ease-in-out infinite}
    .hero-card h4{font-size:13px;font-weight:700;margin-bottom:4px}
    .hero-card p{font-size:11px;color:var(--gray-mid);line-height:1.4}
    .hero-card .tag{display:inline-block;background:var(--orange-light);color:var(--orange);font-size:10px;font-weight:700;padding:3px 8px;border-radius:4px;margin-bottom:8px}
    .hero-card .num{font-size:28px;font-weight:900;color:var(--orange)}
    .hero-blob{position:absolute;width:320px;height:320px;background:radial-gradient(circle,rgba(255,77,0,0.08) 0%,transparent 70%);border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%)}
    .hero-dots{position:absolute;top:40px;left:40px;display:grid;grid-template-columns:repeat(5,8px);gap:12px}
    .hero-dots span{width:8px;height:8px;border-radius:50%;background:rgba(255,77,0,0.15)}
    .hero-dots span:nth-child(3){background:var(--orange)}
    .hero-dots span:nth-child(7){background:var(--orange);opacity:0.5}
    @keyframes float1{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
    @keyframes float2{0%,100%{transform:translateY(0)}50%{transform:translateY(10px)}}
    @keyframes float3{0%,100%{transform:translateY(-50%) translateX(0)}50%{transform:translateY(calc(-50% - 8px)) translateX(-5px)}}
    @media(max-width:768px){
      .hero-inner{grid-template-columns:1fr}
      .hero-visual{display:none}
      .hero h1{font-size:clamp(32px,7vw,48px)}
      .hero-trust{flex-direction:column;gap:12px}
    }

    /* STATS */
    .stats-bar{padding:60px 0;border-top:1px solid rgba(0,0,0,0.06);border-bottom:1px solid rgba(0,0,0,0.06)}
    .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:32px}
    .stat-item{text-align:center}
    .stat-num{font-size:42px;font-weight:900;color:var(--orange);letter-spacing:-0.03em}
    .stat-label{font-size:13px;color:var(--gray-mid);margin-top:6px;line-height:1.4}
    .stat-source{font-size:10px;color:#bbb;margin-top:2px;font-family:var(--mono)}

    /* MARQUEE */
    .marquee-wrap{padding:24px 0;background:var(--yellow);overflow:hidden}
    .marquee-track{display:flex;animation:marquee 25s linear infinite;white-space:nowrap}
    .marquee-track span{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;padding:0 24px;display:flex;align-items:center;gap:24px}
    .marquee-track span::after{content:'';display:block;width:14px;height:14px;background:var(--black);clip-path:polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%)}
    @keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

    /* SECTIONS */
    .section{padding:var(--section-pad) 0}
    .section-label{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--gray-mid);margin-bottom:20px}
    .section-label::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--orange)}
    .section-title{font-size:clamp(28px,3.5vw,42px);font-weight:800;line-height:1.15;letter-spacing:-0.02em;max-width:700px}
    .section-title .accent{color:var(--orange)}

    /* PAIN POINTS */
    .pain-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;margin-top:56px}
    .pain-card{padding:36px;border-radius:16px;background:var(--gray-light)}
    .pain-icon{width:48px;height:48px;border-radius:12px;background:var(--orange);display:flex;align-items:center;justify-content:center;margin-bottom:20px}
    .pain-icon svg{width:24px;height:24px;stroke:white;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .pain-card h3{font-size:18px;font-weight:800;margin-bottom:10px}
    .pain-card p{font-size:14px;line-height:1.65;color:var(--gray-dark)}

    /* HOW IT WORKS */
    .how-section{padding:var(--section-pad) 0;background:var(--gray-light)}
    .flow-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:48px}
    .flow-step{text-align:center;padding:32px 24px;position:relative}
    .flow-step::after{content:'';position:absolute;top:52px;right:-16px;width:32px;height:2px;background:var(--orange)}
    .flow-step:last-child::after{display:none}
    .flow-num{width:56px;height:56px;border-radius:50%;background:var(--orange);color:white;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;margin:0 auto 18px}
    .flow-step h4{font-size:16px;font-weight:700;margin-bottom:8px}
    .flow-step p{font-size:13px;color:var(--gray-dark);line-height:1.55}

    /* BENEFITS */
    .benefit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:56px}
    .benefit-card{border:1px solid rgba(0,0,0,0.06);border-radius:16px;padding:32px;transition:all 0.3s}
    .benefit-card:hover{box-shadow:0 8px 40px rgba(0,0,0,0.06);transform:translateY(-2px)}
    .benefit-card h3{font-size:17px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:10px}
    .benefit-card h3::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--orange);flex-shrink:0}
    .benefit-card p{font-size:13px;line-height:1.6;color:var(--gray-dark)}

    /* ROLES */
    .role-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:56px}
    .role-card{background:var(--gray-light);border-radius:12px;padding:28px;transition:all 0.2s}
    .role-card:hover{background:var(--orange-light)}
    .role-card h4{font-size:16px;font-weight:700;margin-bottom:8px}
    .role-card p{font-size:12px;line-height:1.55;color:var(--gray-dark)}

    /* TRUST */
    .trust-section{padding:var(--section-pad) 0;background:var(--gray-light)}
    .trust-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:48px}
    .trust-card{background:white;border-radius:12px;padding:28px;border-left:3px solid var(--orange)}
    .trust-card h4{font-size:15px;font-weight:700;margin-bottom:8px}
    .trust-card p{font-size:13px;line-height:1.6;color:var(--gray-dark)}

    /* CTA */
    .cta-section{padding:var(--section-pad) 0;text-align:center}
    .cta-section h2{font-size:clamp(28px,3.5vw,42px);font-weight:900;letter-spacing:-0.02em}
    .cta-section h2 .accent{color:var(--orange)}
    .cta-section p{font-size:16px;color:var(--gray-dark);margin:20px auto 36px;max-width:520px;line-height:1.7}
    .cta-buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
    .btn-primary{display:inline-flex;align-items:center;gap:10px;background:var(--orange);color:white;font-size:15px;font-weight:600;padding:16px 36px;border-radius:100px;text-decoration:none;transition:all 0.2s;border:none;cursor:pointer;font-family:var(--font)}
    .btn-primary:hover{background:var(--orange-hover);transform:translateY(-1px)}
    .btn-primary svg{width:18px;height:18px}
    .btn-outline{display:inline-flex;align-items:center;gap:10px;background:transparent;color:var(--orange);font-size:14px;font-weight:600;padding:14px 28px;border-radius:100px;text-decoration:none;transition:all 0.2s;border:1.5px solid var(--orange);cursor:pointer;font-family:var(--font)}
    .btn-outline:hover{background:var(--orange-light)}
    .cta-contact{margin-top:24px;font-size:13px;color:var(--gray-mid)}
    .cta-contact a{color:var(--orange);text-decoration:none;font-weight:600}

    /* FOOTER */
    .footer{padding:48px 0;border-top:1px solid rgba(0,0,0,0.06)}
    .footer-inner{display:flex;justify-content:space-between;align-items:center}
    .footer-left{font-size:12px;color:var(--gray-mid)}
    .footer-links{display:flex;gap:24px}
    .footer-links a{font-size:12px;color:var(--gray-mid);text-decoration:none;transition:color 0.2s}
    .footer-links a:hover{color:var(--orange)}

    /* RESPONSIVE */
    @media(max-width:768px){
      .stats-grid{grid-template-columns:repeat(2,1fr)}
      .pain-grid,.benefit-grid,.role-grid,.flow-steps{grid-template-columns:1fr}
      .trust-grid{grid-template-columns:1fr}
      .flow-step::after{display:none}
      .nav-links a:not(.cta){display:none}
      .container{padding:0 20px}
      .footer-inner{flex-direction:column;gap:16px}
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <div class="nav-inner">
    <a href="#" class="nav-logo">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="8" cy="8" r="6" fill="#FF4D00"/>
        <circle cx="24" cy="8" r="6" fill="#FF4D00"/>
        <circle cx="8" cy="24" r="6" fill="#FF4D00"/>
        <circle cx="24" cy="24" r="6" fill="#FF4D00"/>
      </svg>
      <span>EMPLOYER POOL AI</span>
    </a>
    <div class="nav-links">
      <a href="#how">How It Works</a>
      <a href="#benefits">Benefits</a>
      <a href="#roles">Roles</a>
      <a href="#contact" class="cta">Free Consultation</a>
    </div>
  </div>
</nav>

<div id="app"></div>

<script>
fetch('/content/landing.json')
  .then(r => r.json())
  .then(d => {
    const app = document.getElementById('app');
    const esc = s => s ? s.replace(/</g,'&lt;').replace(/>/g,'&gt;') : '';

    const icons = {
      clock: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
      filter: '<svg viewBox="0 0 24 24"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>',
      globe: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>'
    };

    app.innerHTML = `
    <!-- HERO -->
    <section class="hero">
      <div class="container">
        <div class="hero-inner">
          <div class="hero-content">
            <div class="hero-badge">${esc(d.hero.badge)}</div>
            <h1>${esc(d.hero.title_bold)}<span class="fade">${esc(d.hero.title_fade)}</span></h1>
            <p class="hero-sub">${esc(d.hero.subtitle)}</p>
            <div class="hero-cta">
              <a href="#contact" class="btn-primary">
                ${esc(d.hero.cta_primary)}
                <svg viewBox="0 0 18 18" fill="none"><path d="M4 9h10M10 5l4 4-4 4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </a>
              <a href="#how" class="btn-outline">${esc(d.hero.cta_secondary)}</a>
            </div>
            <div class="hero-trust">
              <div class="hero-trust-item">
                <svg viewBox="0 0 18 18" fill="none"><path d="M9 1l2.2 4.5L16 6.3l-3.5 3.4.8 4.8L9 12.3 4.7 14.5l.8-4.8L2 6.3l4.8-.8L9 1z" fill="#FF4D00"/></svg>
                Zero Cost
              </div>
              <div class="hero-trust-item">
                <svg viewBox="0 0 18 18" fill="none"><path d="M15 5L7.5 13 3 9" stroke="#FF4D00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Pre-Screened
              </div>
              <div class="hero-trust-item">
                <svg viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="7" stroke="#FF4D00" stroke-width="2"/><path d="M9 5v4l2.5 1.5" stroke="#FF4D00" stroke-width="2" stroke-linecap="round"/></svg>
                5–7 Day Match
              </div>
            </div>
          </div>
          <div class="hero-visual">
            <div class="hero-blob"></div>
            <div class="hero-dots">${Array(15).fill('<span></span>').join('')}</div>
            <div class="hero-card hero-card-1">
              <div class="tag">Matched</div>
              <h4>Marketing Intern</h4>
              <p>Singapore · Remote · 3 months</p>
            </div>
            <div class="hero-card hero-card-2">
              <div class="num">63%</div>
              <p>Intern-to-fulltime conversion</p>
            </div>
            <div class="hero-card hero-card-3">
              <div class="tag">New Role</div>
              <h4>Full-Stack Dev Intern</h4>
              <p>Kuala Lumpur · On-site · 6 months</p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- STATS -->
    <section class="stats-bar">
      <div class="container">
        <div class="stats-grid">
          ${d.stats.map(s => `
            <div class="stat-item">
              <div class="stat-num">${s.num === '0' ? '$0' : esc(s.num)}</div>
              <div class="stat-label">${esc(s.label)}</div>
              ${s.source ? `<div class="stat-source">${esc(s.source)}</div>` : ''}
            </div>
          `).join('')}
        </div>
      </div>
    </section>

    <!-- MARQUEE -->
    <div class="marquee-wrap">
      <div class="marquee-track">
        ${d.marquee.concat(d.marquee).map(m => `<span>${esc(m)}</span>`).join('')}
      </div>
    </div>

    <!-- PAIN POINTS -->
    <section class="section" id="pain">
      <div class="container">
        <div class="section-label">${esc(d.pain_points.label)}</div>
        <h2 class="section-title">${esc(d.pain_points.title)}<span class="accent">${esc(d.pain_points.title_accent)}</span></h2>
        <div class="pain-grid">
          ${d.pain_points.items.map(p => `
            <div class="pain-card">
              <div class="pain-icon">${icons[p.icon] || icons.globe}</div>
              <h3>${esc(p.title)}</h3>
              <p>${esc(p.desc)}</p>
            </div>
          `).join('')}
        </div>
      </div>
    </section>

    <!-- HOW IT WORKS -->
    <section class="how-section" id="how">
      <div class="container">
        <div class="section-label">${esc(d.how_it_works.label)}</div>
        <h2 class="section-title">${esc(d.how_it_works.title)}<span class="accent">${esc(d.how_it_works.title_accent)}</span></h2>
        <div class="flow-steps">
          ${d.how_it_works.steps.map(s => `
            <div class="flow-step">
              <div class="flow-num">${esc(s.num)}</div>
              <h4>${esc(s.title)}</h4>
              <p>${esc(s.desc)}</p>
            </div>
          `).join('')}
        </div>
      </div>
    </section>

    <!-- BENEFITS -->
    <section class="section" id="benefits">
      <div class="container">
        <div class="section-label">${esc(d.benefits.label)}</div>
        <h2 class="section-title">${esc(d.benefits.title)}<span class="accent">${esc(d.benefits.title_accent)}</span></h2>
        <div class="benefit-grid">
          ${d.benefits.items.map(b => `
            <div class="benefit-card">
              <h3>${esc(b.title)}</h3>
              <p>${esc(b.desc)}</p>
            </div>
          `).join('')}
        </div>
      </div>
    </section>

    <!-- ROLES -->
    <section class="section" id="roles" style="background:var(--gray-light)">
      <div class="container">
        <div class="section-label">${esc(d.roles.label)}</div>
        <h2 class="section-title">${esc(d.roles.title)}<span class="accent">${esc(d.roles.title_accent)}</span></h2>
        <div class="role-grid">
          ${d.roles.categories.map(r => `
            <div class="role-card">
              <h4>${esc(r.title)}</h4>
              <p>${esc(r.examples)}</p>
            </div>
          `).join('')}
        </div>
      </div>
    </section>

    <!-- TRUST -->
    <section class="trust-section">
      <div class="container">
        <div class="section-label">${esc(d.trust.label)}</div>
        <h2 class="section-title">${esc(d.trust.title)}<span class="accent">${esc(d.trust.title_accent)}</span></h2>
        <div class="trust-grid">
          ${d.trust.items.map(t => `
            <div class="trust-card">
              <h4>${esc(t.title)}</h4>
              <p>${esc(t.desc)}</p>
            </div>
          `).join('')}
        </div>
      </div>
    </section>

    <!-- CTA -->
    <section class="cta-section section" id="contact">
      <div class="container">
        <div class="section-label" style="justify-content:center;">Get Started</div>
        <h2>${esc(d.cta.title_text)}<span class="accent">${esc(d.cta.title_accent)}</span></h2>
        <p>${esc(d.cta.subtitle)}</p>
        <div class="cta-buttons">
          <a href="mailto:${esc(d.cta.contact_email)}" class="btn-primary">
            ${esc(d.cta.primary_btn)}
            <svg viewBox="0 0 18 18" fill="none"><path d="M4 9h10M10 5l4 4-4 4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>
        </div>
        <div class="cta-contact">
          Email: <a href="mailto:${esc(d.cta.contact_email)}">${esc(d.cta.contact_email)}</a>
          ${d.cta.contact_wechat ? ` &nbsp;|&nbsp; WeChat: ${esc(d.cta.contact_wechat)}` : ''}
        </div>
      </div>
    </section>

    <!-- FOOTER -->
    <footer class="footer">
      <div class="container">
        <div class="footer-inner">
          <div class="footer-left">${esc(d.footer.copyright)}</div>
          <div class="footer-links">
            <a href="#how">How It Works</a>
            <a href="#benefits">Benefits</a>
            <a href="#roles">Roles</a>
            <a href="#contact">Contact</a>
          </div>
        </div>
      </div>
    </footer>
    `;
  });
</script>

</body>
</html>
